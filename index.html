<!doctype html>
<html lang="en" data-accent="blue">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>DURF · Dutch Repository Federation</title>
<meta name="description" content="DURF, the Dutch Repository Federation, makes the Dutch scholarly corpus global, open and resilient: key figures, the six themes, announcements, the timeline and links to the position paper, roadmap, data contracts and dashboards.">
<link rel="canonical" href="https://durf-project.github.io/project-page/">
<meta property="og:title" content="DURF · Dutch Repository Federation">
<meta property="og:description" content="Making the Dutch scholarly corpus global, open and resilient, together.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://durf-project.github.io/project-page/">
<meta property="og:image" content="https://durf-project.github.io/durf-design-system/assets/durf-og.png">
<link rel="icon" type="image/svg+xml" href="https://durf-project.github.io/durf-design-system/assets/favicon.svg">
<link rel="apple-touch-icon" href="https://durf-project.github.io/durf-design-system/assets/apple-touch-icon.png">

<!-- DURF design system v1.1: Oat, tokens, site components; durf-nav.js without defer (no flash of the wrong theme).
     The page itself has no styles: every section comes from content/*.md, rendered by durf-site.js. -->
<link rel="stylesheet" href="https://durf-project.github.io/durf-design-system/lib/oat.min.css">
<link rel="stylesheet" href="https://durf-project.github.io/durf-design-system/durf.css">
<link rel="stylesheet" href="https://durf-project.github.io/durf-design-system/durf-site.css">
<script src="https://durf-project.github.io/durf-design-system/durf-nav.js"></script>
<style>
/* The Corpus dialog, loaded from the position paper (same styles as there). */
.durf-commons-more { margin-top: 1.5rem; }
/* The circles picture of the federation uses the full width; the text keeps its reading width. */
#federation .durf-site-prose, #federation .durf-section-head { max-width: none; }
#federation .durf-section-head > :not(p:has(img), .dc-wrap) { max-width: 46rem; }
/* On narrow screens the picture keeps a readable size and scrolls sideways. */
#federation .dc-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: var(--radius-medium, .75rem); }
@media (max-width: 60rem) { #federation .dc-wrap svg.durf-circles { width: 60rem; max-width: none; } }
#federation img, #federation svg.durf-circles { display: block; width: 100%; height: auto; }
/* Interactive circles: a group lights up its members in the federation in its own colour. */
svg.durf-circles .dc-group { cursor: pointer; outline: none; }
svg.durf-circles .dc-dot { transition: stroke-width .15s ease; }
svg.durf-circles .dc-group:hover .dc-dot, svg.durf-circles .dc-group:focus-visible .dc-dot,
svg.durf-circles .dc-group.is-active .dc-dot { stroke-width: 8; }
svg.durf-circles .dc-inst { transition: opacity .15s ease; }
svg.durf-circles .dc-inst rect { transition: fill .15s ease, stroke .15s ease; }
svg.durf-circles[data-active] .dc-inst:not(.is-on) { opacity: .4; }
svg.durf-circles .dc-inst.is-on rect { fill: var(--dc-color); stroke: var(--dc-color); }
svg.durf-circles .dc-inst.is-on .dc-label { fill: var(--dc-on); }
@media (prefers-reduced-motion: reduce) { svg.durf-circles * { transition: none !important; } }
dialog.dc-people { width: min(46rem, calc(100vw - 2rem)); }
.dc-people-list { list-style: none; margin: .5rem 0 1rem; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); gap: .875rem 1.25rem; }
.dc-people-list li { display: grid; grid-template-columns: 3.5rem 1fr; gap: .75rem; align-items: center; font-size: .9375rem; line-height: 1.35; }
.dc-people-list em { color: var(--muted-foreground); font-style: normal; font-size: .875rem; }
.dc-face { width: 3.5rem; height: 3.5rem; border-radius: 50%; overflow: hidden; display: grid; place-items: center;
  box-shadow: 0 0 0 .1875rem var(--dc-c); background: color-mix(in srgb, var(--dc-c) 18%, var(--background));
  font-family: var(--font-heading); font-weight: 800; color: var(--foreground); }
.dc-face img { width: 100%; height: 100%; object-fit: cover; }
.dc-insts { font-size: .875rem; color: var(--muted-foreground); }
/* ?embed&only=federation: just this one section, e.g. for a presentation */
html[data-only] #durf-sections > section:not([data-only-keep]) { display: none !important; }
html[data-only] .durf-subnav, html[data-only] .durf-footer, html[data-only] #durf-feedback { display: none !important; }
html[data-only] [data-only-keep] { padding-block: .5rem !important; }
/* only the picture of the federation section, as large as the window allows */
html[data-only="federation"] #federation .durf-section-head > :not(.dc-wrap) { display: none; }
html[data-only="federation"] #federation .dc-wrap { overflow: visible; }
html[data-only="federation"] #federation svg.durf-circles { width: auto !important; max-width: 100%; height: calc(100vh - 1.5rem); margin: 0 auto; }
/* Inline, the picture takes the page's colours: no white sheet, cards and tints on the page
   background, text in the text colours, so it also reads well in dark mode. */
svg.durf-circles { --dc-title: #134C78; }
svg.durf-circles .dc-bg { fill: transparent; }
svg.durf-circles .dc-ink { fill: var(--foreground); }
svg.durf-circles .dc-muted { fill: var(--muted-foreground); }
svg.durf-circles .dc-title { fill: var(--dc-title); }
svg.durf-circles .dc-card { fill: var(--card, var(--background)); }
svg.durf-circles .dc-tint { fill: color-mix(in srgb, var(--dc-c) 12%, var(--background)); }
svg.durf-circles .dc-later { fill: color-mix(in srgb, #177ABF 6%, var(--background)); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) svg.durf-circles { --dc-title: #8EC5F0; }
  :root:not([data-theme="light"]) svg.durf-circles .dc-tint,
  :root:not([data-theme="light"]) svg.durf-circles .dc-card { stroke: color-mix(in srgb, var(--dc-c) 70%, #fff); }
}
:root[data-theme="dark"] svg.durf-circles { --dc-title: #8EC5F0; }
:root[data-theme="dark"] svg.durf-circles .dc-tint,
:root[data-theme="dark"] svg.durf-circles .dc-card { stroke: color-mix(in srgb, var(--dc-c) 70%, #fff); }
dialog.durf-dialog {
  width: min(40rem, calc(100vw - 2rem));
  max-height: calc(100vh - 2rem);
  padding: 0;
  border: .0625rem solid var(--border);
  border-radius: .75rem;
  background: var(--background);
  color: var(--foreground);
  box-shadow: 0 1.5rem 3rem color-mix(in srgb, var(--durf-black) 25%, transparent);
}
dialog.durf-dialog::backdrop { background: color-mix(in srgb, var(--durf-black) 55%, transparent); }
dialog.durf-dialog form { display: flex; flex-direction: column; max-height: calc(100vh - 2rem); margin: 0; }
dialog.durf-dialog header { padding: 1.25rem 1.5rem .75rem; border-bottom: .0625rem solid var(--border); }
dialog.durf-dialog header h3 { margin: 0; font-size: 1.25rem; line-height: 1.3; }
dialog.durf-dialog .durf-dialog-kicker {
  margin: 0 0 .25rem;
  font-family: var(--font-sans);
  font-size: .6875rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--accent-solid);
}
dialog.durf-dialog .durf-dialog-body { position: relative; padding: .5rem 1.5rem; overflow-y: auto; }
dialog.durf-dialog .durf-dialog-body p, dialog.durf-dialog .durf-dialog-body li { font-size: 1rem; line-height: 1.55; }
dialog.durf-dialog .durf-dialog-body ul,
dialog.durf-dialog .durf-dialog-body ol { margin-top: .25rem; }
dialog.durf-dialog .durf-dialog-body h4 {
  margin: 1.75rem 0 .5rem;
  padding-top: 1.25rem;
  border-top: .0625rem solid var(--border);
  font-family: var(--font-heading);
  font-size: 1.0625rem;
  font-weight: 800;
  scroll-margin-top: .5rem;
}
dialog.durf-dialog .durf-dialog-body h4#corpus-ostrom { margin-top: 1.25rem; padding-top: 0; border-top: 0; }
dialog.durf-dialog .durf-dialog-body .durf-dialog-refs {
  margin-top: 1.25rem;
  padding-top: 1rem;
  border-top: .0625rem solid var(--border);
  font-size: .875rem;
  line-height: 1.5;
  color: var(--muted-foreground);
}
dialog.durf-dialog .durf-dialog-body .durf-dialog-refs p { margin: 0 0 .5rem; font-size: inherit; line-height: inherit; }
dialog.durf-dialog .durf-dialog-refs strong { color: var(--foreground); }
dialog.durf-dialog .durf-dialog-refs cite { font-style: italic; }
dialog.durf-dialog .durf-dialog-refs a { overflow-wrap: anywhere; }

dialog.durf-dialog footer { display: flex; justify-content: flex-end; padding: .75rem 1.5rem 1.25rem; border-top: .0625rem solid var(--border); }
dialog.durf-dialog footer button {
  padding: .5rem 1.25rem;
  border: 0;
  border-radius: .375rem;
  background: var(--accent-solid);
  color: var(--accent-on);
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}
dialog.durf-dialog footer button:focus-visible { outline: .125rem solid var(--accent-solid); outline-offset: .125rem; }
</style>
<script src="https://durf-project.github.io/durf-design-system/lib/oat.min.js" defer></script>
<script src="https://durf-project.github.io/durf-design-system/lib/marked.min.js" defer></script>
<script src="https://durf-project.github.io/durf-design-system/durf-site.js" defer></script>
</head>
<body>

<nav class="durf-subnav" aria-label="On this page">
  <div class="durf-shell durf-subnav__inner" data-durf-section-nav></div>
</nav>

<main id="durf-sections">
  <p class="durf-loading">Loading…</p>
</main>

<footer class="durf-footer durf-footer--site">
  <div class="durf-colour-strip" aria-hidden="true"></div>
  <div class="durf-shell durf-footer__inner">
    <img class="durf-footer__logo" src="https://durf-project.github.io/durf-design-system/assets/durf-logo.svg" alt="DURF, Dutch Repository Federation">
    <div class="durf-footer__text" id="durf-footer"></div>
  </div>
</footer>

<noscript><div class="durf-shell"><p>This page needs JavaScript to render its content. The texts are also readable on GitHub in the <a href="https://github.com/durf-project/project-page/tree/main/content">content folder</a>, and as plain HTML in <a href="portal/durf-project-page.html">portal/durf-project-page.html</a>.</p></div></noscript>

<script>
// Small behaviours on top of the design system: the Corpus dialog (below),
// a link to #some-announcement opens that item, also after the page has loaded, and
// a link to the feedback issue form opens the feedback dialog of the page instead (the link stays as fallback).
(function () {
  function openHash() {
    var t = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (t && t.tagName === 'DETAILS' && !t.open) { t.open = true; t.scrollIntoView(); }
  }
  window.addEventListener('hashchange', openHash);
  // On load, jump to the #target at once: a smooth scroll lands too far while the pictures above it load.
  document.addEventListener('durf:rendered', function () {
    var t = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (t) t.scrollIntoView({ behavior: 'instant' });
  });
  // "Read more about the Corpus as a commons": open the Corpus dialog of the position paper,
  // taken from position-paper.md so the text is exactly the same, at its commons part.
  // If loading fails, the link to the position paper is followed instead.
  var PAPER_MD = 'https://durf-project.github.io/position-paper/position-paper.md';
  var corpusDialog = null;
  function showCorpus(dlg) {
    if (!dlg.open) dlg.showModal();
    window.requestAnimationFrame(function () {
      var body = dlg.querySelector('.durf-dialog-body'), t = dlg.querySelector('#corpus-commons');
      if (body && t) body.scrollTop = t.offsetTop - 8;
    });
  }
  // The federation picture: put the SVG inline so its circles can be pointed at. A group circle
  // lights up its members in the federation in the group's colour, on hover, focus or tap.
  // Without JavaScript the picture stays a plain image.
  function circles() {
    var img = document.querySelector('#federation img[src*="durf-circles.svg"]');
    if (!img) return;
    fetch(img.src).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }).then(function (text) {
      var tpl = document.createElement('template'); tpl.innerHTML = text.trim();
      var svg = tpl.content.querySelector('svg');
      if (!svg) return;
      svg.removeAttribute('width'); svg.removeAttribute('height');
      var holder = img.closest('p') || img.closest('a') || img;
      var wrap = document.createElement('div');
      wrap.className = 'dc-wrap';
      wrap.appendChild(svg);
      holder.replaceWith(wrap);
      var pinned = null;
      function show(g) {
        var key = g && g.dataset.group;
        if (key) {
          svg.setAttribute('data-active', key);
          svg.style.setProperty('--dc-color', g.dataset.color);
          svg.style.setProperty('--dc-on', g.dataset.on);
        } else svg.removeAttribute('data-active');
        svg.querySelectorAll('.dc-inst').forEach(function (i) {
          i.classList.toggle('is-on', !!key && (' ' + i.dataset.groups + ' ').indexOf(' ' + key + ' ') >= 0);
        });
        svg.querySelectorAll('.dc-group').forEach(function (x) {
          x.classList.toggle('is-active', x === g);
          x.setAttribute('aria-pressed', x === pinned ? 'true' : 'false');
        });
      }
      svg.querySelectorAll('.dc-group').forEach(function (g) {
        g.addEventListener('mouseenter', function () { show(g); });
        g.addEventListener('mouseleave', function () { show(pinned); });
        g.addEventListener('focus', function () { show(g); });
        g.addEventListener('blur', function () { show(pinned); });
        g.addEventListener('click', function () { pinned = g; show(g); openPeople(g, svg); });
        g.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); g.dispatchEvent(new MouseEvent('click')); }
          if (e.key === 'Escape') { pinned = null; show(null); }
        });
      });
    }).catch(function () { /* keep the plain image */ });
  }
  document.addEventListener('durf:rendered', circles);
  var only = new URLSearchParams(location.search).get('only');
  if (only) {
    document.documentElement.setAttribute('data-only', only);
    document.addEventListener('durf:rendered', function () {
      var s = document.getElementById(only);
      if (s) s.setAttribute('data-only-keep', '');
    });
  }

  // Clicking a circle opens a dialog with the people in it (content/people.json) and the
  // institutions it lights up in the federation. Without a photo a person gets initials.
  var peopleData = null;
  function loadPeople() {
    if (!peopleData) peopleData = fetch('content/people.json').then(function (r) { return r.ok ? r.json() : { groups: {} }; }).catch(function () { return { groups: {} }; });
    return peopleData;
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function initials(n) { return n.split(/\s+/).filter(function (w) { return /^[A-Z]/.test(w); }).map(function (w) { return w[0]; }).join('').slice(0, 2) || '?'; }
  function openPeople(g, svg) {
    var key = g.dataset.group, colour = g.dataset.color;
    loadPeople().then(function (data) {
      var grp = (data.groups || {})[key] || {};
      var title = grp.title || g.getAttribute('aria-label').replace(/: show who takes part$/, '');
      var names = Array.prototype.filter.call(svg.querySelectorAll('.dc-inst'), function (i) {
        return (' ' + i.dataset.groups + ' ').indexOf(' ' + key + ' ') >= 0;
      }).map(function (i) { return i.dataset.name || i.dataset.key; }).filter(function (n) { return n !== 'and more ...'; });
      var dlg = document.getElementById('dc-people');
      if (!dlg) {
        dlg = document.createElement('dialog');
        dlg.id = 'dc-people'; dlg.className = 'durf-dialog dc-people'; dlg.setAttribute('closedby', 'any');
        dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
        document.body.appendChild(dlg);
      }
      var people = (grp.people || []).map(function (p) {
        var pic = p.photo ? '<img src="' + esc(p.photo) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),{textContent:this.dataset.i}))" data-i="' + esc(initials(p.name)) + '">' : '<span>' + esc(initials(p.name)) + '</span>';
        return '<li><span class="dc-face" style="--dc-c:' + esc(colour) + '">' + pic + '</span><span><strong>' + esc(p.name) + '</strong>' +
          (p.institution ? '<br>' + esc(p.institution) : '') + (p.role ? '<br><em>' + esc(p.role) + '</em>' : '') + '</span></li>';
      }).join('');
      dlg.innerHTML = '<form method="dialog"><header style="border-top:.375rem solid ' + esc(colour) + '"><p class="durf-dialog-kicker">The federation and its circles</p><h3>' + esc(title) + '</h3></header>' +
        '<div class="durf-dialog-body">' + (grp.about ? '<p>' + esc(grp.about) + '</p>' : '') +
        (people ? '<ul class="dc-people-list">' + people + '</ul>' : '') +
        (names.length ? '<p class="dc-insts"><strong>Institutions (' + names.length + '):</strong> ' + names.map(esc).join(', ') + '</p>' : '') +
        '</div><footer><button type="submit">Close</button></footer></form>';
      dlg.showModal();
    });
  }
  document.addEventListener('click', function (e) {
    var more = e.target.closest && e.target.closest('[data-corpus-dialog]');
    if (!more) return;
    e.preventDefault();
    if (corpusDialog) return showCorpus(corpusDialog);
    fetch(PAPER_MD).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }).then(function (md) {
      var m = /<dialog id="corpus-definition"[\s\S]*?<\/dialog>/.exec(md);
      if (!m) throw new Error('no dialog');
      var tpl = document.createElement('template'); tpl.innerHTML = m[0];
      var dlg = tpl.content.querySelector('dialog');
      dlg.querySelectorAll('a[href]').forEach(function (a) { a.target = '_blank'; a.rel = 'noopener'; });
      dlg.querySelector('footer button').addEventListener('click', function (ev) { ev.preventDefault(); dlg.close(); });
      if (!('closedBy' in HTMLDialogElement.prototype)) dlg.addEventListener('click', function (ev) { if (ev.target === dlg) dlg.close(); });
      document.body.appendChild(dlg);
      corpusDialog = dlg;
      showCorpus(dlg);
    }).catch(function () { location.href = more.href; });
  });
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href*="/issues/new?template=feedback.yml"]');
    var host = a && document.getElementById('durf-feedback');
    var fab = host && host.shadowRoot && host.shadowRoot.querySelector('.fab');
    if (fab) { e.preventDefault(); fab.click(); }
  });
})();
</script>
</body>
</html>
