<!-- DURF design system v1.1: Oat, tokens, site components; durf-nav.js without defer (no flash of the wrong theme).
     The page itself has no styles: every section comes from content/*.md, rendered by durf-site.js. -->
<link rel="stylesheet" href="https://durf-project.github.io/durf-design-system/lib/oat.min.css">
<link rel="stylesheet" href="https://durf-project.github.io/durf-design-system/durf.css">

<script src="https://durf-project.github.io/durf-design-system/durf-site.js" defer></script>

<body>

<nav class="durf-subnav" aria-label="On this page">
  <div class="durf-shell durf-subnav__inner" data-durf-section-nav></div>
</nav>

<main id="durf-sections">
  <p class="durf-loading">Loading…</p>
</main>

<footer class="durf-footer durf-footer--site">
  <div class="durf-colour-strip" aria-hidden="true"></div>
  <div class="durf-shell durf-footer__inner">
    <img class="durf-footer__logo" src="https://durf-project.github.io/durf-design-system/assets/durf-logo.svg" alt="DURF, Dutch Repository Federation">

  </div>
</footer>

<noscript><div class="durf-shell"><p>This page needs JavaScript to render its content. The texts are also readable on GitHub in the <a href="https://github.com/durf-project/project-page/tree/main/content">content folder</a>, and as plain HTML in <a href="portal/durf-project-page.html">portal/durf-project-page.html</a>.</p></div></noscript>

<script>
// Two small behaviours on top of the design system:
// a link to #some-announcement opens that item, also after the page has loaded, and
// a link to the feedback issue form opens the feedback dialog of the page instead (the link stays as fallback).
(function () {
  function openHash() {
    var t = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (t && t.tagName === 'DETAILS' && !t.open) { t.open = true; t.scrollIntoView(); }
  }
  window.addEventListener('hashchange', openHash);
  // On load, jump to the #target at once: a smooth scroll lands too far while the pictures above it load.
  document.addEventListener('durf:rendered', function () {
    var t = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (t) t.scrollIntoView({ behavior: 'instant' });
  });
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href*="/issues/new?template=feedback.yml"]');
    var host = a && document.getElementById('durf-feedback');
    var fab = host && host.shadowRoot && host.shadowRoot.querySelector('.fab');
    if (fab) { e.preventDefault(); fab.click(); }
  });
})();
</script>
</body>
</html>
